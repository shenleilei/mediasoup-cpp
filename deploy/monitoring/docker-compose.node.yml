# 部署在每台 SFU 节点（25台）
# Alloy + Node Exporter
# 使用前替换 <MONITOR_CENTER_IP> 为监控中心的内网 IP
services:
  alloy:
    image: grafana/alloy:v1.4.2
    command: run /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.node.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
      - "--collector.processes"
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    restart: unless-stopped

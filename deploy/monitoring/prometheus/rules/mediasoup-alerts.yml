groups:
  - name: mediasoup-infra-alerts
    rules:
      - alert: SfuHttpEndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: P1
          team: rtc
          escalation: immediate
        annotations:
          summary: "SFU HTTP endpoint unavailable"
          description: "Blackbox probe failed for {{ $labels.instance }} for >2m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: SfuHealthEndpointDown
        expr: probe_success{job="blackbox-sfu-health"} == 0
        for: 1m
        labels:
          severity: P1
          team: rtc
          escalation: immediate
        annotations:
          summary: "SFU application health degraded"
          description: "Health probe failed for {{ $labels.instance }} for >1m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: SfuNoAvailableWorkers
        expr: mediasoup_sfu_has_available_workers == 0
        for: 1m
        labels:
          severity: P1
          team: rtc
          escalation: immediate
        annotations:
          summary: "SFU has no available mediasoup workers"
          description: "No workers are available on {{ $labels.instance }} for >1m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: NodeCpuHigh
        expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 85
        for: 10m
        labels:
          severity: P2
          team: rtc
        annotations:
          summary: "Node CPU usage high"
          description: "CPU usage > 85% on {{ $labels.instance }} for 10m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: NodeMemoryPressure
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 10m
        labels:
          severity: P2
          team: rtc
        annotations:
          summary: "Node memory pressure high"
          description: "Memory usage > 90% on {{ $labels.instance }} for 10m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: NodeDiskPressure
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 0.85
        for: 15m
        labels:
          severity: P2
          team: rtc
        annotations:
          summary: "Node disk usage high"
          description: "Disk usage > 85% on {{ $labels.instance }} for 15m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: MediasoupProcessDown
        expr: sum by (instance) (namedprocess_namegroup_num_procs{groupname="mediasoup-sfu"}) < 1
        for: 2m
        labels:
          severity: P1
          team: rtc
          escalation: immediate
        annotations:
          summary: "mediasoup-sfu process down"
          description: "No mediasoup-sfu process is detected for >2m on {{ $labels.instance }}."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: WorkerCrashSuspected
        expr: changes(namedprocess_namegroup_oldest_start_time_seconds{groupname=~"mediasoup-worker.*"}[10m]) > 0
        for: 1m
        labels:
          severity: P2
          team: rtc
        annotations:
          summary: "mediasoup-worker restart detected"
          description: "A mediasoup-worker process appears to have restarted on {{ $labels.instance }}."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: SfuReadyEndpointDown
        expr: mediasoup_sfu_ready == 0
        for: 1m
        labels:
          severity: P1
          team: rtc
          escalation: immediate
        annotations:
          summary: "SFU readiness degraded"
          description: "mediasoup_sfu_ready is 0 on {{ $labels.instance }} for >1m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: SfuWorkerThreadCapacityLow
        expr: mediasoup_sfu_available_worker_threads < 1
        for: 1m
        labels:
          severity: P1
          team: rtc
          escalation: immediate
        annotations:
          summary: "SFU has no available worker threads"
          description: "available worker threads dropped below 1 on {{ $labels.instance }} for >1m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: SfuJoinFailuresDetected
        expr: increase(mediasoup_sfu_join_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: P2
          team: rtc
        annotations:
          summary: "SFU join failures detected"
          description: "{{ $labels.instance }} saw {{ $value }} join failures in the last 5m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: SfuPlainPublishFailuresDetected
        expr: increase(mediasoup_sfu_plain_publish_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: P2
          team: rtc
        annotations:
          summary: "SFU plainPublish failures detected"
          description: "{{ $labels.instance }} saw {{ $value }} plainPublish failures in the last 5m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: SfuPlainSubscribeFailuresDetected
        expr: increase(mediasoup_sfu_plain_subscribe_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: P2
          team: rtc
        annotations:
          summary: "SFU plainSubscribe failures detected"
          description: "{{ $labels.instance }} saw {{ $value }} plainSubscribe failures in the last 5m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: SfuWorkerDeathsDetected
        expr: increase(mediasoup_sfu_worker_deaths_total[5m]) > 0
        for: 0m
        labels:
          severity: P1
          team: rtc
          escalation: immediate
        annotations:
          summary: "SFU worker death detected"
          description: "{{ $labels.instance }} saw {{ $value }} worker death events in the last 5m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: SfuWorkerRespawnsDetected
        expr: increase(mediasoup_sfu_worker_respawns_total[5m]) > 0
        for: 0m
        labels:
          severity: P2
          team: rtc
        annotations:
          summary: "SFU worker respawn detected"
          description: "{{ $labels.instance }} saw {{ $value }} worker respawn events in the last 5m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: SfuMalformedWebSocketMessagesHigh
        expr: increase(mediasoup_sfu_malformed_ws_messages_total[5m]) > 10
        for: 1m
        labels:
          severity: P2
          team: rtc
        annotations:
          summary: "Malformed websocket messages elevated"
          description: "{{ $labels.instance }} dropped {{ $value }} malformed websocket messages in the last 5m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: SfuWorkerThreadQueueDepthHigh
        expr: mediasoup_sfu_worker_thread_queue_depth > 100
        for: 5m
        labels:
          severity: P2
          team: rtc
        annotations:
          summary: "SFU worker thread queue depth high"
          description: "worker thread {{ $labels.thread_id }} queue depth stayed above 100 for >5m."
          runbook: "docs/MONITORING_RUNBOOK.md"

      - alert: SfuWorkerThreadTaskWaitHigh
        expr: mediasoup_sfu_worker_thread_avg_task_wait_us > 50000
        for: 5m
        labels:
          severity: P2
          team: rtc
        annotations:
          summary: "SFU worker thread task wait high"
          description: "worker thread {{ $labels.thread_id }} average task wait exceeded 50ms for >5m."
          runbook: "docs/MONITORING_RUNBOOK.md"

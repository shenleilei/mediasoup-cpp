<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mediasoup Room Client Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1116;
      --surface: #151b22;
      --surface-soft: #1d252d;
      --line: #2e3945;
      --text: #eef3f8;
      --muted: #9eacba;
      --accent: #2f7cf6;
      --accent-strong: #5aa0ff;
      --ok: #36c486;
      --warn: #f0b94b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
    }
    aside {
      border-right: 1px solid var(--line);
      background: #111820;
      padding: 18px;
      display: grid;
      align-content: start;
      gap: 16px;
    }
    .workspace {
      min-width: 0;
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 16px;
    }
    .brand {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: 0;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 650;
      color: var(--muted);
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: 13px;
      white-space: nowrap;
    }
    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
    }
    .status.connected::before { background: var(--ok); }
    .section {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 14px;
    }
    .form {
      display: grid;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    input, select, button {
      width: 100%;
      min-height: 36px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #0d1319;
      color: var(--text);
      padding: 0 10px;
      font: inherit;
    }
    input:focus, select:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 650;
    }
    button.secondary {
      background: var(--surface-soft);
      border-color: var(--line);
      color: var(--text);
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .toolbar-title {
      min-width: 0;
    }
    .toolbar-title strong {
      display: block;
      font-size: 18px;
      font-weight: 650;
    }
    .toolbar-title span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }
    #tracks {
      min-width: 0;
      display: grid;
      align-content: start;
      gap: 14px;
    }
    .empty {
      min-height: 240px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: #10161d;
    }
    .empty[hidden] { display: none; }
    .peer-row {
      min-width: 0;
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #10161d;
    }
    .peer-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }
    .peer-head strong {
      color: var(--text);
      font-size: 15px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    .peer-tracks {
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 360px));
      gap: 10px;
    }
    .tile {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .tile video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #05080b;
      display: block;
    }
    .tile audio {
      width: 100%;
      display: block;
      background: #05080b;
    }
    .meta {
      padding: 10px;
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .meta strong {
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
    }
    .meta span {
      overflow-wrap: anywhere;
    }
    #log {
      min-height: 160px;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      color: var(--muted);
      font: 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .workspace { padding: 14px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .peer-tracks { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <aside>
    <div class="brand">
      <h1>Room Client</h1>
      <span id="state" class="status">idle</span>
    </div>

    <section class="section">
      <h2>Connection</h2>
      <div class="form">
        <label>roomId <input id="roomId" value="demo-room" autocomplete="off"></label>
        <label>wss <input id="wsUrl" autocomplete="off"></label>
        <div class="actions">
          <button id="startBtn">Start</button>
          <button id="stopBtn" class="secondary" disabled>Stop</button>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Talk</h2>
      <div class="form">
        <select id="talkTargets"></select>
        <div class="actions">
          <button id="openTalkBtn" disabled>Open</button>
          <button id="closeTalkBtn" class="secondary" disabled>Close</button>
        </div>
        <span id="talkState" class="status">idle</span>
      </div>
    </section>

    <section class="section">
      <h2>Events</h2>
      <div id="log"></div>
    </section>
  </aside>

  <section class="workspace">
    <div class="toolbar">
      <div class="toolbar-title">
        <strong>Remote Streams</strong>
        <span id="streamSummary">0 active tracks</span>
      </div>
    </div>
    <section id="tracks">
      <div id="emptyState" class="empty">No remote streams</div>
    </section>
  </section>
</main>

<script src="/mediasoup-client.bundle.js"></script>
<script src="/mediasoup-room-client.js"></script>
<script>
  const query = new URLSearchParams(location.search);
  const roomInput = document.getElementById('roomId');
  const wsInput = document.getElementById('wsUrl');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const stateEl = document.getElementById('state');
  const tracksEl = document.getElementById('tracks');
  const emptyState = document.getElementById('emptyState');
  const streamSummary = document.getElementById('streamSummary');
  const logEl = document.getElementById('log');
  const targetSelect = document.getElementById('talkTargets');
  const openTalkBtn = document.getElementById('openTalkBtn');
  const closeTalkBtn = document.getElementById('closeTalkBtn');
  const talkStateEl = document.getElementById('talkState');

  roomInput.value = query.get('roomId') || roomInput.value;
  wsInput.value = query.get('wsUrl') || `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;

  let room = null;
  let talk = null;
  const tiles = new Map();
  const peerRows = new Map();

  function setStatus(el, state) {
    el.textContent = state;
    el.classList.toggle('connected', state === 'connected' || state === 'opened');
  }

  function updateStreamSummary() {
    const count = tiles.size;
    streamSummary.textContent = `${count} active ${count === 1 ? 'track' : 'tracks'}`;
    emptyState.hidden = count > 0;
  }

  function log(message) {
    logEl.textContent = `${new Date().toLocaleTimeString()} ${message}\n${logEl.textContent}`.slice(0, 6000);
  }

  function appendMeta(meta, label, value) {
    const row = document.createElement('span');
    row.textContent = `${label}: ${value || '-'}`;
    meta.appendChild(row);
  }

  function peerKey(info) {
    return info.peerId || 'unknown-peer';
  }

  function ensurePeerRow(info) {
    const key = peerKey(info);
    const existing = peerRows.get(key);
    if (existing) return existing;

    const row = document.createElement('section');
    row.className = 'peer-row';
    row.dataset.peerId = key;

    const head = document.createElement('div');
    head.className = 'peer-head';
    const name = document.createElement('strong');
    name.textContent = info.displayName || info.peerId || 'unknown peer';
    const count = document.createElement('span');
    count.textContent = '0 tracks';
    head.appendChild(name);
    head.appendChild(count);

    const trackGrid = document.createElement('div');
    trackGrid.className = 'peer-tracks';

    row.appendChild(head);
    row.appendChild(trackGrid);
    tracksEl.appendChild(row);

    const entry = { row, trackGrid, count, tracks: new Set() };
    peerRows.set(key, entry);
    return entry;
  }

  function updatePeerRow(entry) {
    const count = entry.tracks.size;
    entry.count.textContent = `${count} ${count === 1 ? 'track' : 'tracks'}`;
  }

  function renderTrack(info) {
    const tile = document.createElement('article');
    tile.className = 'tile';
    tile.dataset.consumerId = info.consumerId;

    const media = document.createElement(info.kind === 'video' ? 'video' : 'audio');
    media.autoplay = true;
    media.playsInline = true;
    media.controls = info.kind === 'audio';
    media.srcObject = info.stream;
    if (info.kind === 'audio') media.muted = false;

    const meta = document.createElement('div');
    meta.className = 'meta';
    const title = document.createElement('strong');
    title.textContent = `${info.kind} · ${info.source || '-'}`;
    meta.appendChild(title);
    appendMeta(meta, 'peer', info.peerId);
    appendMeta(meta, 'producer', info.producerId);
    appendMeta(meta, 'appData', JSON.stringify(info.appData || {}));

    tile.appendChild(media);
    tile.appendChild(meta);
    const row = ensurePeerRow(info);
    row.trackGrid.appendChild(tile);
    row.tracks.add(info.consumerId);
    updatePeerRow(row);
    tiles.set(info.consumerId, tile);
    updateStreamSummary();
    log(`track ${info.kind} ${info.consumerId}`);
  }

  function removeTrack(info) {
    const tile = tiles.get(info.consumerId);
    if (tile) tile.remove();
    tiles.delete(info.consumerId);
    const row = peerRows.get(peerKey(info));
    if (row) {
      row.tracks.delete(info.consumerId);
      if (row.tracks.size === 0) {
        row.row.remove();
        peerRows.delete(peerKey(info));
      } else {
        updatePeerRow(row);
      }
    }
    updateStreamSummary();
    log(`track closed ${info.consumerId}`);
  }

  function renderTargets(targets) {
    targetSelect.innerHTML = '';
    for (const target of targets) {
      const option = document.createElement('option');
      option.value = target.peerId;
      option.textContent = `${target.displayName || target.peerId} (${target.peerId})`;
      targetSelect.appendChild(option);
    }
    openTalkBtn.disabled = !room || targets.length === 0;
  }

  startBtn.onclick = async () => {
    startBtn.disabled = true;
    try {
      room = new MediasoupRoomClient({
        roomId: roomInput.value,
        wsUrl: wsInput.value,
        onTrack: renderTrack,
        onTrackClosed: removeTrack,
        onStateChange: event => { setStatus(stateEl, event.state); },
        onLog: event => log(event.message),
      });
      await room.start();
      talk = new MediasoupAudioTalk(room, {
        onTargetsChanged: renderTargets,
        onStateChange: event => {
          setStatus(talkStateEl, event.state);
          openTalkBtn.disabled = event.state === 'opening' || event.state === 'opened';
          closeTalkBtn.disabled = event.state !== 'opened';
        },
      });
      stopBtn.disabled = false;
      renderTargets(talk.getTargets());
    } catch (error) {
      startBtn.disabled = false;
      log(`start failed: ${error.message}`);
      throw error;
    }
  };

  stopBtn.onclick = async () => {
    if (talk) await talk.closeTalk().catch(() => {});
    if (room) await room.close();
    room = null;
    talk = null;
    for (const tile of tiles.values()) tile.remove();
    tiles.clear();
    for (const row of peerRows.values()) row.row.remove();
    peerRows.clear();
    updateStreamSummary();
    startBtn.disabled = false;
    stopBtn.disabled = true;
    openTalkBtn.disabled = true;
    closeTalkBtn.disabled = true;
    setStatus(talkStateEl, 'idle');
  };

  openTalkBtn.onclick = async () => {
    if (!talk || !targetSelect.value) return;
    await talk.openTalkTo(targetSelect.value);
  };

  closeTalkBtn.onclick = async () => {
    if (talk) await talk.closeTalk();
  };

  updateStreamSummary();
</script>
</body>
</html>
